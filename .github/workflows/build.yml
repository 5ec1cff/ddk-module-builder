name: Build Module
run-name: Build ${{ inputs.module_path }} on multiple branches

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel branch (e.g., android16-6.12, android15-6.6) - multiple branches separated by commas'
        required: true
        default: 'android16-6.12'
      ddk_version:
        description: 'DDK version (default: 20260313)'
        required: false
        default: '20260313'
      module_path:
        description: 'Module relative path in kernel tree (e.g., net/unix or net/netfilter/ipset)'
        required: true
      configs:
        description: 'Options pass to scripts/config, e.g., -m CONFIG_UNIX_DIAG or -m CONFIG_IP_SET'
        required: false
        default: ''

jobs:
  setup-matrix:
    name: Setup build matrix
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set-branches.outputs.branches }}
    steps:
    - id: set-branches
      run: |
        # Convert comma-separated input to JSON array
        BRANCHES_JSON=$(echo '${{ inputs.branch }}' | sed 's/,/","/g' | sed 's/^/["/' | sed 's/$/"]/')
        echo "branches=${BRANCHES_JSON}" >> $GITHUB_OUTPUT

  build-ko:
    name: Build module on ${{ matrix.branch }}
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ${{ fromJson(needs.setup-matrix.outputs.branches) }}
      fail-fast: false
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.branch }}-${{ inputs.ddk_version }}
      options: --privileged

    steps:
    - name: Build 
      run: |
        BRANCH=${{ matrix.branch }}
        MODULE_PATH=${{ inputs.module_path }}
        CONFIGS="${{ inputs.configs }}"
        BRANCH=$BRANCH
        MODULE_PATH=$MODULE_PATH
        CONFIGS="$CONFIGS"
        DDK_VERSION=${{ inputs.ddk_version }}
        
        SRC=/opt/ddk/src/$BRANCH
        mkdir out
        OUT=$(realpath out)
        make -C $SRC O=$OUT gki_defconfig
        
        # Build config parameters from the input
        CONFIG_ARGS="$CONFIGS"
        
        # Apply CONFIG_CFI_ICALL_NORMALIZE_INTEGERS only for android16-6.12
        if [ "$BRANCH" = "android16-6.12" ]; then
          CONFIG_ARGS="$CONFIG_ARGS -e CONFIG_CFI_ICALL_NORMALIZE_INTEGERS"
        fi
        
        $SRC/scripts/config --file $OUT/.config $CONFIG_ARGS
        make -C $SRC O=$OUT olddefconfig
        make -C $SRC O=$OUT modules_prepare
        make -C $SRC O=$OUT M=$SRC/$MODULE_PATH modules
    - name: Prepare Artifacts
      run: |
        # Clone repository
        git clone https://github.com/TanakaLun/IPSET_LKM.git
        BASE="/opt/ddk/src/${{ matrix.branch }}/${{ inputs.module_path }}"
        while IFS= read -r -d '' f; do
          rel_path="${f#$BASE/}"
          dest="IPSET_LKM/netfilter/$rel_path"
          mkdir -p "$(dirname "$dest")"
          cp "$f" "$dest"
        done < <(find "$BASE" -type f -name '*.ko' -print0)
    - name: Upload ZIP Archive
      uses: actions/upload-artifact@v7
      with:
        name: IPSET_LKM_${{ matrix.branch }}
        path: IPSET_LKM
